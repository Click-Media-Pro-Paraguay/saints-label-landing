            - generic [ref=e63]:
              - heading "The Daily Anchor" [level=3] [ref=e64]
              - paragraph [ref=e65]: One passage. Three honest questions underneath it — not "what does this mean," which is a sermon, but "where did I see this yesterday," which is a life. It takes about twelve minutes. That's the whole genius. It's small enough to actually do.
          - generic [ref=e66]:
            - generic [ref=e67]: ii.
