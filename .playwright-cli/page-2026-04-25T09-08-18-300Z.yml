        - paragraph [ref=e92]: "I want to be useful here, not just enthusiastic. After four months, here's the kind of person I'd hand this to without hesitation:"
        - list [ref=e93]:
          - listitem [ref=e94]: The churchgoer who still goes — faithfully — but whose Bible at home has gone quiet.
          - listitem [ref=e95]: The grandmother (or grandfather) who'd like a daily practice their grandchildren might one day inherit.
          - listitem [ref=e96]: Anyone who has tried apps, plans, and beautiful blank journals, and quietly given up on all three.
          - listitem [ref=e97]: The widow or widower whose mornings have gotten too quiet, and who needs a small appointment to keep.
          - listitem [ref=e98]: The Sunday-school teacher, the deacon, the choir alto, who teaches the faith and is ready to be taught by it again.
        - paragraph [ref=e99]:
          - text: "And honestly: if you are looking for a theological deep-dive, a study Bible, or a strict reading plan, this is not that book. It is a gentler thing. It is the thing you do"
          - emphasis [ref=e100]: around
