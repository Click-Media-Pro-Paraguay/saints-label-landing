              - heading "The Weekly Examen" [level=3] [ref=e69]
              - paragraph [ref=e70]: A single page, on Sundays, with room to look back at the week with God instead of against yourself. I have cried on this page more than once. It's the page that turned this from a reading habit into a praying habit.
          - generic [ref=e71]:
            - generic [ref=e72]: iii.
