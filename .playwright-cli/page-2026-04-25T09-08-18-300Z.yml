        - heading "VI. A reader's note From a woman in Ohio I've never met" [level=2] [ref=e101]:
          - generic [ref=e102]: VI. A reader's note
          - text: From a woman in Ohio I've never met
        - paragraph [ref=e103]: "After I mentioned the journal in a small newsletter I write for our women's group, a woman named Marlene wrote back. With her permission, the relevant part:"
        - generic [ref=e104]:
          - generic [ref=e105]: Reader's note
          - paragraph [ref=e106]: "\"I'm 71. My husband passed in October. I had stopped opening my Bible because every page reminded me of him reading it across the table. The journal gave me a different doorway in. Twelve minutes, three questions. I cried the first morning. The second morning I didn't. I'm still here.\""
          - generic [ref=e107]: — Marlene H., Akron, Ohio
        - paragraph [ref=e108]: I include this not as a testimonial — the journal is not a miracle — but because it's the most honest description I've read of what a small, structured practice can do for a quiet grief, or a quiet faith, or a quiet Tuesday.
