        - generic [ref=e12]: A Personal Essay
        - heading "My Bible had been sitting on the same shelf for eleven years. Then a small journal changed my mornings." [level=1] [ref=e13]
        - paragraph [ref=e14]: I'd been a Sunday-school teacher for three decades. I knew the verses. What I'd quietly lost was the practice — the slow, ordinary kind that holds a faith together on a Tuesday.
        - generic [ref=e17]:
          - text: By a quiet Sunday-school teacher
          - generic [ref=e18]: Sponsored essay · 7 min read · Updated this spring
      - figure "The corner of my kitchen table — most mornings. The light comes in around quarter to seven. I've learned to be there before it leaves." [ref=e20]:
        - img "Open Bible on a wooden kitchen table in morning light, with a coffee mug, a small potted plant, a handwritten journal, reading glasses and a leather notebook arranged around it." [ref=e21]
        - generic [ref=e22]: The corner of my kitchen table — most mornings. The light comes in around quarter to seven. I've learned to be there before it leaves.
      - generic [ref=e23]:
        - paragraph [ref=e24]: For a long time I didn't tell anyone. You don't, when you're the woman who teaches the seven-year-olds about Daniel and the lions every other Sunday. You smile, you bring the orange slices, you go home. And you put your Bible back on the same shelf where it has lived, more or less untouched, for eleven years.
        - paragraph [ref=e25]:
          - text: It wasn't a crisis of faith. It was quieter than that. It was the slow, embarrassed feeling of a woman in her sixties who can recite the Beatitudes and still couldn't tell you the last time she'd actually
          - emphasis [ref=e26]: sat
          - text: with them. My prayers had gone shorthand. My Bible had become a reference book I trusted other people to read for me.
        - paragraph [ref=e27]: I'm writing this because I think a lot of us are quietly in the same place, and nobody talks about it.
        - generic [ref=e28]:
          - text: I could recite the Beatitudes. I couldn't remember the last time I'd actually sat with them.
          - generic [ref=e29]: — from the essay
        - heading "I. The silent struggle The shelf, the guilt, and the Tuesday problem" [level=2] [ref=e30]:
          - generic [ref=e31]: I. The silent struggle
          - text: The shelf, the guilt, and the Tuesday problem
        - paragraph [ref=e32]: Sundays were never the issue. Sundays have momentum. The hymns carry you, the people carry you, the pastor carries you. The trouble was Tuesday. Wednesday. The long ordinary middle of the week, when faith is supposed to be a practice and mine had become a memory.
        - figure "An illustration, but you'll know the feeling." [ref=e33]:
          - img "Illustrated portrait of a woman with her hand on her forehead, sitting at a table over an open Bible, with papers and a coffee mug around her." [ref=e34]
          - generic [ref=e35]: An illustration, but you'll know the feeling.
        - paragraph [ref=e36]: I tried the obvious things. I bought one of those one-year-Bible plans with the dated readings. By February it was a quiet accusation on my nightstand. I tried a devotional app — three of them, actually — and discovered that I do not want to meet God through a push notification. I tried just "reading more," which is the worst kind of advice, like telling a tired person to sleep harder.
        - paragraph [ref=e37]: What I needed, and didn't know how to ask for, was something small enough to actually do, and structured enough that I couldn't talk myself out of it at 6:30 in the morning.
        - heading "II. Why most journals fail Blank pages are a kind of bullying" [level=2] [ref=e38]:
          - generic [ref=e39]: II. Why most journals fail
          - text: Blank pages are a kind of bullying
        - paragraph [ref=e40]:
          - text: I'd tried Bible journals before. Beautiful ones, even. The trouble with most of them is that they hand you a beautiful blank page and a suggestion —
          - emphasis [ref=e41]: reflect
          - text: — and then leave you alone with it. At 6:30 in the morning, with a half-warm cup of coffee, "reflect" is not a prompt. It's a wall.
        - paragraph [ref=e42]: "The other kind goes too far the other direction: rigid, dense, full of theology that reads like homework. By page six I'd feel like I was failing a class I'd signed up for in good faith."
        - paragraph [ref=e43]: "What was missing, in both, was the gentle middle: a hand on your back, not a hand on your shoulder. Something that told you where to look today, gave you a few honest questions, and let your own life walk into the page."
        - generic [ref=e44]: • • •
        - heading "III. Discovering it A daughter-in-law, a brown paper package" [level=2] [ref=e45]:
          - generic [ref=e46]: III. Discovering it
          - text: A daughter-in-law, a brown paper package
        - paragraph [ref=e47]:
          - text: "My daughter-in-law sent it. She is not a sentimental person, which is part of why I trusted the gesture. The package came on a Thursday — a cloth-bound journal, the color of an old hymnal, with a small note:"
          - emphasis [ref=e48]: Mom, this is the one I use. Just try a week.
        - figure "The package my daughter-in-law sent — the cloth-bound one in the color of an old hymnal." [ref=e49]:
          - img "A woman in a cream cable-knit sweater holds a brown leather Bible Study Guide journal in her lap, with a small plant on a wooden table behind her." [ref=e50]
          - generic [ref=e51]: The package my daughter-in-law sent — the cloth-bound one in the color of an old hymnal.
        - paragraph [ref=e52]:
          - text: It's called the
          - strong [ref=e53]: Saints Label Bible Study Guide Journal
          - text: ". I had not heard of it. I almost set it aside, the way you set aside a kindness you're not ready for. But Friday morning, the kettle was already on, and the journal was already on the table, and I thought: a week."
        - paragraph [ref=e54]: Reader, I am now four months in. I have not missed more than two mornings in a row. I want to tell you, plainly, what is different about it.
        - generic [ref=e55]:
